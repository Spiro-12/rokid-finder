name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile check with the experimental Mac link on
        run: ./gradlew --no-daemon assembleDebug -PbrainLink=true
      - name: Build the default APK (glasses-only, no Mac link)
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rokid-finder-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
